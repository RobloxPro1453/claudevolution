[package]
name = "{{crate}}"
version = "0.1.0"
edition = "2024"
# The program checks start (cv check reads this, never "the newest file in target/").
default-run = "{{crate}}"

[dependencies]
# Pinned: a template that follows a moving version breaks on the day it moves. Raise on purpose.
eframe = "=0.37.0"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# One small, fast file: link-time optimisation, one codegen unit, symbols stripped, aborts on panic
# (the start guard below still sees a crash: the mark it leaves survives the process).
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3
